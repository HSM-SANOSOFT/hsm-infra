global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

certificatesResolvers:
  letsencrypt:
    acme:
      keyType: EC256
      email: rsantamariao@hospitalsantamaria.com.ec
      storage: /etc/certs/acme.json
      dnsChallenge:
        provider: digitalocean

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: :443
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: "hospitalsm.net"
            sans:
              - "*.hospitalsm.net"

  # NOTE: entrypoints are the PUBLIC edge — they must NOT expect an inbound
  # PROXY header (no upstream LB sends one). The PROXY header we want is
  # Traefik -> Stalwart, set per-service via
  # traefik.tcp.services.<name>.loadbalancer.proxyProtocol.version=2 in compose.yml.
  # Adding proxyProtocol here made the server-first SMTP handshake deadlock
  # ~60s waiting for a PROXY header clients never send.
  smtp:
    address: :25
  submission:
    address: :587
  smtps:
    address: :465
  imap:
    address: :143
  imaps:
    address: :993
  pop3:
    address: :110
  pop3s:
    address: :995
  managesieve:
    address: :4190

tls:
  options:
    default:
      minVersion: VersionTLS12

providers:
  docker:
    exposedByDefault: false