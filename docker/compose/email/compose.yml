volumes:
  stalwart_data:
  stalwart_etc:
  bulwark-settings:
  bulwark-admin:
  bulwark-admin-state:
  bulwark-telemetry:

networks:
  email_network:
    driver: bridge

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: stalwart
    volumes:
      - stalwart_data:/var/lib/stalwart
      - stalwart_etc:/etc/stalwart
    ports:
      - 25:25
      - 110:110
      - 143:143
      - 443:443
      - 465:465
      - 587:587
      - 993:993
      - 995:995
      - 4190:4190
      - 8080:8080
    networks:
      - email_network
    environment:
      - STALWART_PUBLIC_URL=mail.hospitalsm.net
    restart: unless-stopped

  bulwart:
    image: ghcr.io/bulwarkmail/webmail:latest
    container_name: bulwart
    volumes:
      - bulwark-settings:/app/data/settings
      - bulwark-admin:/app/data/admin
      - bulwark-admin-state:/app/data/admin-state
      - bulwark-telemetry:/app/data/telemetry
    ports:
      - 3000:3000
    networks:
      - email_network
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - APP_NAME=Bulwark Webmail
      - JMAP_SERVER_URL=https://mail.hospitalsm.net
      - STALWART_FEATURES=true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped