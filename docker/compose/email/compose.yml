volumes:
  stalwart_data:
  stalwart_etc:

networks:
  email_network:
    driver: bridge

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: stalwart
    volumes:
      - stalwart_data:/var/lib/stalwart
      - stalwart_etc:/etc/stalwart
    ports:
      - 25:25
      - 110:110
      - 143:143
      - 443:443
      - 465:465
      - 587:587
      - 993:993
      - 995:995
      - 4190:4190
      - 8080:8080
    networks:
      - email_network
    restart: unless-stopped