volumes:
  stalwart_data:
  stalwart_etc:
  bulwark-settings:
  bulwark-admin:
  bulwark-admin-state:
  bulwark-telemetry:
  traefik_letsencrypt:

networks:
  email_network:
    driver: bridge

services:
  traefik:
    image: traefik:v3.7.3
    container_name: traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=rsantamariao@hospitalsantamaria.com.ec
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - email_network
    restart: unless-stopped

  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: stalwart
    volumes:
      - stalwart_data:/var/lib/stalwart
      - stalwart_etc:/etc/stalwart
    ports:
      # mail protocols stay published directly — NOT through Traefik
      - 25:25
      - 110:110
      - 143:143
      - 465:465
      - 587:587
      - 993:993
      - 995:995
      - 4190:4190
      # note: 443 and 8080 are NO LONGER published to the host;
      # Traefik reaches :8080 over the internal network
    networks:
      - email_network
    environment:
      - STALWART_PUBLIC_URL=https://mail.hospitalsm.net   # scheme required
    labels:
      - traefik.enable=true
      - traefik.http.routers.stalwart.rule=Host(`mail.hospitalsm.net`)
      - traefik.http.routers.stalwart.entrypoints=websecure
      - traefik.http.routers.stalwart.tls.certresolver=le
      - traefik.http.services.stalwart.loadbalancer.server.port=8080
    restart: unless-stopped

  bulwark:
    image: ghcr.io/bulwarkmail/webmail:latest
    container_name: bulwark
    volumes:
      - bulwark-settings:/app/data/settings
      - bulwark-admin:/app/data/admin
      - bulwark-admin-state:/app/data/admin-state
      - bulwark-telemetry:/app/data/telemetry
    networks:
      - email_network
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - APP_NAME=Bulwark Webmail
      - JMAP_SERVER_URL=https://mail.hospitalsm.net
      - STALWART_FEATURES=true
    labels:
      - traefik.enable=true
      - traefik.http.routers.bulwark.rule=Host(`webmail.hospitalsm.net`)
      - traefik.http.routers.bulwark.entrypoints=websecure
      - traefik.http.routers.bulwark.tls.certresolver=le
      - traefik.http.services.bulwark.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD","wget","--no-verbose","--tries=1","--spider","http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped