volumes:
  stalwart_data:
  stalwart_etc:
  bulwark-settings:
  bulwark-admin:
  bulwark-admin-state:
  bulwark-telemetry:
  acme:
  certs:

networks:
  email_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  traefik:
    image: traefik:v3.7.3
    container_name: traefik
    restart: unless-stopped
    env_file: .env
    ports:
      - 80:80
      - 443:443
      - 8080:8080 # dashboard (no auth — firewall it)
      - 25:25
      - 110:110
      - 143:143
      - 465:465
      - 587:587
      - 993:993
      - 995:995
      - 4190:4190
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - acme:/etc/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - email_network

  traefik-certs-dumper:
    image: ghcr.io/kereis/traefik-certs-dumper:latest
    container_name: traefik-certs-dumper
    restart: unless-stopped
    depends_on:
      - traefik
    environment:
      - OVERRIDE_UID=2000
      - OVERRIDE_GID=2000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - acme:/traefik:ro
      - certs:/output
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - email_network

  mail:
    image: stalwartlabs/stalwart:v0.16
    container_name: mail
    restart: unless-stopped
    volumes:
      - stalwart_data:/var/lib/stalwart
      - stalwart_etc:/etc/stalwart
      - certs:/data/certs:ro # cert-dumper output, read-only
    ports:
      - 8081:8080 # admin (plaintext — firewall it)
    networks:
      - email_network
    environment:
      - STALWART_PUBLIC_URL=https://mail.hospitalsm.net
    labels:
      - traefik.enable=true
      # web (Traefik terminates TLS, forwards plain HTTP to :8080)
      - traefik.http.routers.mail.rule=Host(`mail.hospitalsm.net`)
      - traefik.http.routers.mail.entrypoints=websecure
      - traefik.http.routers.mail.service=mail
      - traefik.http.services.mail.loadbalancer.server.port=8080
      - traefik.http.services.mail.loadbalancer.proxyProtocol.version=2
      # SMTP 25 (STARTTLS) — raw TCP + Proxy Protocol
      - traefik.tcp.routers.smtp.rule=HostSNI(`*`)
      - traefik.tcp.routers.smtp.entrypoints=smtp
      - traefik.tcp.routers.smtp.service=smtp
      - traefik.tcp.services.smtp.loadbalancer.server.port=25
      - traefik.tcp.services.smtp.loadbalancer.proxyProtocol.version=2
      # Submission 587 (STARTTLS)
      - traefik.tcp.routers.submission.rule=HostSNI(`*`)
      - traefik.tcp.routers.submission.entrypoints=submission
      - traefik.tcp.routers.submission.service=submission
      - traefik.tcp.services.submission.loadbalancer.server.port=587
      - traefik.tcp.services.submission.loadbalancer.proxyProtocol.version=2
      # Submissions 465 (implicit TLS) — passthrough
      - traefik.tcp.routers.smtps.rule=HostSNI(`*`)
      - traefik.tcp.routers.smtps.entrypoints=smtps
      - traefik.tcp.routers.smtps.tls.passthrough=true
      - traefik.tcp.routers.smtps.service=smtps
      - traefik.tcp.services.smtps.loadbalancer.server.port=465
      - traefik.tcp.services.smtps.loadbalancer.proxyProtocol.version=2
      # IMAP 143 (STARTTLS)
      - traefik.tcp.routers.imap.rule=HostSNI(`*`)
      - traefik.tcp.routers.imap.entrypoints=imap
      - traefik.tcp.routers.imap.service=imap
      - traefik.tcp.services.imap.loadbalancer.server.port=143
      - traefik.tcp.services.imap.loadbalancer.proxyProtocol.version=2
      # IMAPS 993 (implicit TLS) — passthrough
      - traefik.tcp.routers.imaps.rule=HostSNI(`*`)
      - traefik.tcp.routers.imaps.entrypoints=imaps
      - traefik.tcp.routers.imaps.tls.passthrough=true
      - traefik.tcp.routers.imaps.service=imaps
      - traefik.tcp.services.imaps.loadbalancer.server.port=993
      - traefik.tcp.services.imaps.loadbalancer.proxyProtocol.version=2
      # POP3 110 (STARTTLS)
      - traefik.tcp.routers.pop3.rule=HostSNI(`*`)
      - traefik.tcp.routers.pop3.entrypoints=pop3
      - traefik.tcp.routers.pop3.service=pop3
      - traefik.tcp.services.pop3.loadbalancer.server.port=110
      - traefik.tcp.services.pop3.loadbalancer.proxyProtocol.version=2
      # POP3S 995 (implicit TLS) — passthrough
      - traefik.tcp.routers.pop3s.rule=HostSNI(`*`)
      - traefik.tcp.routers.pop3s.entrypoints=pop3s
      - traefik.tcp.routers.pop3s.tls.passthrough=true
      - traefik.tcp.routers.pop3s.service=pop3s
      - traefik.tcp.services.pop3s.loadbalancer.server.port=995
      - traefik.tcp.services.pop3s.loadbalancer.proxyProtocol.version=2
      # ManageSieve 4190 (STARTTLS)
      - traefik.tcp.routers.managesieve.rule=HostSNI(`*`)
      - traefik.tcp.routers.managesieve.entrypoints=managesieve
      - traefik.tcp.routers.managesieve.service=managesieve
      - traefik.tcp.services.managesieve.loadbalancer.server.port=4190
      - traefik.tcp.services.managesieve.loadbalancer.proxyProtocol.version=2

  webmail:
    image: ghcr.io/bulwarkmail/webmail:latest
    container_name: webmail
    restart: unless-stopped
    volumes:
      - bulwark-settings:/app/data/settings
      - bulwark-admin:/app/data/admin
      - bulwark-admin-state:/app/data/admin-state
      - bulwark-telemetry:/app/data/telemetry
    ports:
      - 8082:3000 # webmail (plaintext — Traefik handles TLS)
    networks:
      - email_network
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - APP_NAME=Bulwark Webmail
      - JMAP_SERVER_URL=https://mail.hospitalsm.net
      - STALWART_FEATURES=true
    labels:
      - traefik.enable=true
      - traefik.http.routers.bulwark.rule=Host(`webmail.hospitalsm.net`)
      - traefik.http.routers.bulwark.entrypoints=websecure
      - traefik.http.services.bulwark.loadbalancer.server.port=3000
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
